name: voxa
description: "Voxa - Voice-first AI-powered to-do assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.2
  provider: ^6.1.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.5.1
  speech_to_text: ^7.3.0
  permission_handler: ^11.4.0
  lottie: ^3.3.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_tts: 3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
